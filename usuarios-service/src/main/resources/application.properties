spring.application.name=usuarios-service
server.port=8081

# MySQL (XAMPP / Laragon por defecto: usuario root sin clave). La base se crea sola.
spring.datasource.url=jdbc:mysql://localhost:3306/cocina_usuarios?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=

# Hibernate crea/actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
